name: G10 Check-in Fixture

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - kong/g10-release-lock.json
      - kong/validate-g10-lock.py
      - kong/validate-g10-lock_test.py
      - kong/render-g10-config.py
      - kong/render-g10-config_test.py
      - kong/g10-kong-template.yml
      - kong/g10-compose.yml
      - kong/generate-g10-certs.sh
      - kong/g10-business-check.sh
      - kong/run-g10.sh
      - kong/generated-gateway/**
      - helm/gym-service/**

permissions:
  contents: read
  packages: read

jobs:
  g10:
    name: G10 locked fixture gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.G10_READ_TOKEN || github.token }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate GHCR pull
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Validate G10 locked fixture
        run: ./kong/run-g10.sh
      - name: Require sanitized evidence
        run: test -s kong/g10-sanitized-evidence.yaml
      - name: Upload sanitized G10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g10-sanitized-${{ github.sha }}
          path: kong/g10-sanitized-evidence.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Upload private G10 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g10-failure-${{ github.sha }}
          path: |
            kong/g10-last-run.log
            kong/g10-raw-evidence.yaml
            kong/g10-rendered-kong.yml
          if-no-files-found: ignore
          retention-days: 3
