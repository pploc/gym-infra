name: Infrastructure CI

on:
  push:
    branches: [develop, main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: read

jobs:
  helm-service-istio-on:
    name: Helm gym-service (Istio on)
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-service
      release_name: gym-service
      set_args: istio.enabled=true ingress.enabled=false

  helm-service-istio-off:
    name: Helm gym-service (nginx Ingress)
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-service
      release_name: gym-service
      set_args: istio.enabled=false ingress.enabled=true

  helm-service-member-example:
    name: Helm gym-service member example
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-service
      release_name: ms-gym-member
      values_file: helm/gym-service/examples/ms-gym-member-values.yaml

  helm-infra:
    name: Helm gym-infra
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-infra
      release_name: gym-infra

  go-sample:
    name: Go sample service
    uses: ./.github/workflows/go-ci.yml
    with:
      service_path: services/go-service
      go_version: '1.22.x'
      coverage_min: '95'
      golangci_version: v1.59.1

  java-sample:
    name: Java sample service
    uses: ./.github/workflows/java-ci.yml
    with:
      service_path: services/java-service
      java_version: '26'
      gradle_args: check

  config-validate:
    name: Central config YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('config/central/application-global.yml'))"
          echo "application-global.yml valid"

  docker-go-sample:
    name: Docker go-service (push on branch)
    needs: [go-sample]
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    uses: ./.github/workflows/docker-build.yml
    with:
      service_name: go-service
      context: services/go-service
      push: true
      max_tags: 20
    permissions:
      contents: read
      packages: write

  docker-java-sample:
    name: Docker java-service (push on branch)
    needs: [java-sample]
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    uses: ./.github/workflows/docker-build.yml
    with:
      service_name: java-service
      context: services/java-service
      push: true
      max_tags: 20
    permissions:
      contents: read
      packages: write
