name: Infrastructure CI

on:
  push:
    branches: [develop, main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: read

jobs:
  helm-service-istio-on:
    name: Helm gym-service (Istio on)
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-service
      release_name: gym-service
      set_args: istio.enabled=true ingress.enabled=false

  helm-service-istio-off:
    name: Helm gym-service (nginx Ingress)
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-service
      release_name: gym-service
      set_args: istio.enabled=false ingress.enabled=true

  helm-service-member-example:
    name: Helm gym-service member example
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-service
      release_name: ms-gym-member
      values_file: helm/gym-service/examples/ms-gym-member-values.yaml

  helm-infra:
    name: Helm gym-infra
    uses: ./.github/workflows/helm-validate.yml
    with:
      chart_path: helm/gym-infra
      release_name: gym-infra

  go-sample:
    name: Go sample service
    uses: ./.github/workflows/go-ci.yml
    with:
      service_path: services/go-service
      go_version: '1.22.x'
      coverage_min: '95'
      golangci_version: v1.59.1

  java-sample:
    name: Java sample service
    uses: ./.github/workflows/java-ci.yml
    with:
      service_path: services/java-service
      java_version: '26'
      gradle_args: check

  config-validate:
    name: Central config YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('config/central/application-global.yml'))"
          echo "application-global.yml valid"

  stage-3-static:
    name: Stage 3 static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kong/tests/go.mod
          cache-dependency-path: kong/tests/go.sum
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Assert exact NetworkPolicies
        run: helm/gym-service/tests/networkpolicy_test.sh
      - name: Check Stage 3 scripts and Compose
        run: |
          set -euo pipefail
          sh -n kong/run-g9.sh kong/g9-business-check.sh kong/g9-compatibility-check.sh kong/verify-openapi-types.sh
          python3 -m py_compile kong/render-g9-config.py kong/materialize-g9.py kong/validate-g9-lock.py kong/sanitize-g9-evidence.py
          python3 kong/validate-g9-lock.py kong/g9-release-lock.json
          python3 -m unittest kong/materialize-g9_test.py kong/validate-g9-lock_test.py kong/sanitize-g9-evidence_test.py
          docker compose -f kong/docker-compose.yml config --quiet
          G9_PROTO_ROOT=/tmp/g9-proto G9_IDENTIFIER_ROOT=/tmp/g9-identifier G9_MEMBER_ROOT=/tmp/g9-member G9_PLANS_ROOT=/tmp/g9-plans G9_GATEWAY_IMAGE=ghcr.io/pploc/ms-gym-api-gateway@sha256:$(printf '0%.0s' $(seq 1 64)) docker compose -f kong/g9-compose.yml config --quiet
          (cd kong/tests && go test -run '^$' ./...)

  docker-go-sample:
    name: Docker go-service (push on branch)
    needs: [go-sample]
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    uses: ./.github/workflows/docker-build.yml
    with:
      service_name: go-service
      context: services/go-service
      push: true
      max_tags: 20
    permissions:
      contents: read
      packages: write

  docker-java-sample:
    name: Docker java-service (push on branch)
    needs: [java-sample]
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    uses: ./.github/workflows/docker-build.yml
    with:
      service_name: java-service
      context: services/java-service
      push: true
      max_tags: 20
    permissions:
      contents: read
      packages: write
