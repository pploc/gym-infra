name: Reusable Helm Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      environment:
        required: true
        type: string
        default: 'staging'
      image_tag:
        required: true
        type: string
    secrets:
      KUBECONFIG:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Set up Kubeconfig (if provided)
        if: secrets.KUBECONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Validate Helm Template
        run: |
          helm template ${{ inputs.service_name }} ./helm/gym-service \
            --namespace gym-${{ inputs.environment }} \
            --set image.tag=${{ inputs.image_tag }}

      - name: Execute Helm Upgrade (if Kubeconfig present)
        if: secrets.KUBECONFIG != ''
        run: |
          helm upgrade --install ${{ inputs.service_name }} ./helm/gym-service \
            --namespace gym-${{ inputs.environment }} \
            --create-namespace \
            --set image.tag=${{ inputs.image_tag }}
