name: Reusable Java CI

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
        default: 'services/java-service'

jobs:
  java-test:
    name: Java Unit & Integration Tests (Coverage >= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ${{ inputs.service_path }}/gradlew

      - name: Run Gradle Check & JaCoCo Verification
        run: |
          cd ${{ inputs.service_path }}
          ./gradlew check jacocoTestReport jacocoTestCoverageVerification
