name: Reusable Go CI

on:
  workflow_call:
    inputs:
      service_path:
        required: true
        type: string
        default: 'services/go-service'

jobs:
  go-test:
    name: Go Unit & Integration Tests (Coverage >= 95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Tests
        run: |
          cd ${{ inputs.service_path }}
          go test -v -coverprofile=coverage.out ./...

      - name: Verify Coverage (>= 95%)
        run: |
          cd ${{ inputs.service_path }}
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Go Total Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 95.0" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below required 95.0%"
            exit 1
          fi
