name: Go CI

on:
  workflow_call:
    inputs:
      service_path:
        description: Path to Go module root
        required: false
        type: string
        default: '.'
      go_version:
        description: Go toolchain version
        required: false
        type: string
        default: '1.26.x'
      coverage_min:
        description: Minimum total coverage percent
        required: false
        type: string
        default: '95'
      coverpkg:
        description: Optional -coverpkg value (e.g. ./internal/...) when unit tests live outside packages under test
        required: false
        type: string
        default: ''
      golangci_version:
        description: golangci-lint version
        required: false
        type: string
        default: 'v1.64.5'

jobs:
  go-test:
    name: Lint, Unit & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.service_path }}/go.sum

      - name: Configure private Go modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$GITHUB_TOKEN" ] || exit 0
          export GOPRIVATE=github.com/pploc/*
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gym-private-modules.gitconfig"
          umask 077
          cat > "$GIT_CONFIG_GLOBAL" <<EOF
          [url "https://x-access-token:${GITHUB_TOKEN}@github.com/"]
              insteadOf = https://github.com/
          EOF
          printf 'GOPRIVATE=%s\nGIT_CONFIG_GLOBAL=%s\n' "$GOPRIVATE" "$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ inputs.golangci_version }}
          install-mode: goinstall
          working-directory: ${{ inputs.service_path }}

      - name: Unit tests with coverage
        run: |
          if [ -n "${{ inputs.coverpkg }}" ]; then
            go test -race -coverprofile=coverage.out -coverpkg=${{ inputs.coverpkg }} ./...
          else
            go test -race -coverprofile=coverage.out ./...
          fi

      - name: Verify coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "Go total coverage: ${COVERAGE}% (min ${{ inputs.coverage_min }}%)"
          awk -v c="$COVERAGE" -v m="${{ inputs.coverage_min }}" 'BEGIN { exit (c+0 < m+0) ? 1 : 0 }' \
            || { echo "ERROR: coverage ${COVERAGE}% below ${{ inputs.coverage_min }}%"; exit 1; }

      - name: Remove private Go module credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gym-private-modules.gitconfig"
