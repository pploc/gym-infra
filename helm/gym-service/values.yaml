# Generic microservice chart — override per service via -f values-<service>.yaml

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/pploc/gym-service
  pullPolicy: IfNotPresent
  # Prefer immutable tags (:sha) in real deploys; override via --set image.tag=
  tag: "develop"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false # Java/Spring often needs writable tmp; set true for static Go bins
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  grpcPort: 50051
  httpPort: 8080
  metricsPort: 9090 # Set null when service has no metrics listener.

config:
  logLevel: "INFO"
  extraData: {}

# HTTP probes (Spring Actuator defaults). Override paths for Go (/healthz).
probes:
  enabled: true
  liveness:
    path: /actuator/health/liveness
    port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    enabled: true
    path: /actuator/health/liveness
    port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints: []

# Classic nginx Ingress — disabled when Istio is the north-south entry
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.gym.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Istio mesh + optional Gateway attachment (shared chart; enable per install)
istio:
  enabled: true
  inject: true
  # Create Gateway in this release only when true (usually one shared Gateway)
  gateway:
    create: false
    name: gym-gateway
    selector:
      istio: ingressgateway
    hosts:
      - api.gym.local
    # HTTP only for local; add tls later
    port: 80
  virtualService:
    enabled: true
    # Gateway resource name(s) to attach; same namespace unless fully qualified
    gateways:
      - gym-gateway
    hosts:
      - api.gym.local
    # HTTP match prefix → service HTTP port
    prefix: /
  destinationRule:
    enabled: true
    tlsMode: ISTIO_MUTUAL
  peerAuthentication:
    enabled: true
    mtlsMode: STRICT

env:
  - name: ENV
    value: "production"

# Extra volume mounts (e.g. emptyDir /tmp when readOnlyRootFilesystem=true)
volumeMounts: []
volumes: []

secrets: {}

# Disabled by default. Enable only for services whose released migration runner and SQL are declared below.
migration:
  enabled: false
  image: ""
  command: []
  env: []
  sql: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  networkPolicy:
    egress: []

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes: istio-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ms-gym-gateway
        - podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50051
  egress: []
