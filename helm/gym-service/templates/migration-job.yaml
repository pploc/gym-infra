{{- if .Values.migration.enabled }}
{{- if .Values.migration.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-migration" (include "gym-service.fullname" .)) .Values.migration.serviceAccount.name }}
  labels:
    {{- include "gym-service.labels" . | nindent 4 }}
  {{- with .Values.migration.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gym-service.fullname" . }}-migration
  labels:
    {{- include "gym-service.labels" . | nindent 4 }}
data:
  migration.sql: |
    {{- .Values.migration.sql | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gym-service.fullname" . }}-migration
  labels:
    {{- include "gym-service.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gym-service.name" . }}-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ default (printf "%s-migration" (include "gym-service.fullname" .)) .Values.migration.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migration
          image: {{ required "migration.image is required when migration is enabled" .Values.migration.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            {{- toYaml .Values.migration.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- toYaml .Values.migration.env | nindent 12 }}
          volumeMounts:
            - name: migration
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migration
          configMap:
            name: {{ include "gym-service.fullname" . }}-migration
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gym-service.fullname" . }}-migration
  labels:
    {{- include "gym-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gym-service.name" . }}-migration
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    {{- toYaml .Values.migration.networkPolicy.egress | nindent 4 }}
{{- end }}
