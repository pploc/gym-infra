      protected_routes:
        - "^/api/v1/auth/logout$"
        - "^/api/v1/users/me$"
        - "^/api/v1/users/password$"
        - "^/api/v1/auth/gym$"
        - "^/api/v1/admin/.*"
        - "^/api/v1/members/me$"
      membership_gated_routes:
        - "^/api/v1/memberships/booking"
      # Local fixture talks to compose service "redis". Omit redis_host in prod to disable.
      redis_host: redis
      redis_port: 6379
      redis_timeout_ms: 50
      redis_database: 0
