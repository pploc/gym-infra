_format_version: "3.0"
_transform: true

services:
  - name: ms-gym-identifier
    url: http://mock-upstream:8080
    routes:
      - name: identifier-public-register
        paths:
          - /api/v1/auth/register
        strip_path: false
      - name: identifier-public-login
        paths:
          - /api/v1/auth/login
        strip_path: false
      - name: identifier-public-google-login
        paths:
          - /api/v1/auth/oauth/google
        strip_path: false
      - name: identifier-public-refresh
        paths:
          - /api/v1/auth/refresh
        strip_path: false
      - name: identifier-public-verify-email
        paths:
          - /api/v1/auth/email/verify
        strip_path: false
      - name: identifier-public-resend-email
        paths:
          - /api/v1/auth/email/resend
        strip_path: false
      - name: identifier-protected-logout
        paths:
          - /api/v1/auth/logout
        strip_path: false
      - name: identifier-protected-me
        paths:
          - /api/v1/users/me
        strip_path: false
      - name: identifier-protected-change-password
        paths:
          - /api/v1/users/password
        strip_path: false
      - name: identifier-protected-select-gym
        paths:
          - /api/v1/auth/gym
        strip_path: false
      - name: identifier-protected-trainer
        paths:
          - /api/v1/admin/trainers
        strip_path: false
      - name: identifier-protected-suspend
        paths:
          - /api/v1/admin/users/.*/suspend
        strip_path: false
      - name: identifier-protected-users
        paths:
          - /api/v1/admin/users
        strip_path: false

  - name: ms-gym-member
    url: http://mock-upstream:8080
    routes:
      - name: member-protected-profile
        paths:
          - /api/v1/members/me
        strip_path: false
      - name: member-gated-booking
        paths:
          - /api/v1/memberships/booking
        strip_path: false

