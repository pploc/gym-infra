_format_version: "3.0"
_transform: true

services:
  - name: ms-gym-identifier
    url: http://ms-gym-identifier:8080
    routes:
      - name: identifier-public-register
        paths: [/api/v1/auth/register]
        methods: [POST]
        strip_path: false
      - name: identifier-public-login
        paths: [/api/v1/auth/login]
        methods: [POST]
        strip_path: false
      - name: identifier-public-google-login
        paths: [/api/v1/auth/oauth/google]
        methods: [POST]
        strip_path: false
      - name: identifier-public-refresh
        paths: [/api/v1/auth/refresh]
        methods: [POST]
        strip_path: false
      - name: identifier-public-verify-email
        paths: [/api/v1/auth/email/verify]
        methods: [POST]
        strip_path: false
      - name: identifier-public-resend-email
        paths: [/api/v1/auth/email/resend]
        methods: [POST]
        strip_path: false
      - name: identifier-protected-logout
        paths: [/api/v1/auth/logout]
        methods: [POST]
        strip_path: false
      - name: identifier-protected-me
        paths: [/api/v1/users/me]
        methods: [GET]
        strip_path: false
      - name: identifier-protected-change-password
        paths: [/api/v1/users/password]
        methods: [POST]
        strip_path: false
      - name: identifier-protected-select-gym
        paths: [/api/v1/auth/gym]
        methods: [POST]
        strip_path: false
      - name: identifier-protected-trainer
        paths: [/api/v1/admin/trainers]
        methods: [POST]
        strip_path: false
      - name: identifier-protected-suspend
        paths: ["~/api/v1/admin/users/[^/]+/suspend$"]
        methods: [POST]
        strip_path: false
      - name: identifier-protected-users
        paths: ["~/api/v1/admin/users$"]
        methods: [GET]
        strip_path: false

  # Fixture-only route for gateway membership-policy tests; not a Member API.
  - name: kong-policy-fixture
    url: http://mock-upstream:8080
    routes:
      - name: fixture-membership-gated
        paths: [/__fixtures/membership-gated]
        methods: [POST]
        strip_path: false

