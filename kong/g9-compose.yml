name: gym-g9

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  identity-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 2s
      timeout: 2s
      retries: 20

  member-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gym_member
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_member"]
      interval: 2s
      timeout: 2s
      retries: 20

  plans-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plans_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plans_db"]
      interval: 2s
      timeout: 2s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  topic-seed:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >-
      sh -ec 'for topic in
      identity.user.registered.v1 identity.user.suspended.v1 identity.user.role-changed.v1
      identity.email.verification-requested.v1 payment.completed.v1
      membership.activated.v1 membership.paused.v1 membership.resumed.v1
      membership.expiring-soon.v1 membership.expired.v1; do
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1;
      done'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30

  schema-seed:
    image: eclipse-temurin:26-jdk
    depends_on:
      topic-seed:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    working_dir: /tmp/gym-proto
    environment:
      GRADLE_USER_HOME: /tmp/gradle
    volumes:
      - ${G9_PROTO_ROOT:?G9_PROTO_ROOT is required}:/source:ro
    command: >-
      sh -ec 'cp -R /source/. /tmp/gym-proto &&
      ./gradlew seedConfluentSchemas -PschemaRegistryUrl=http://schema-registry:8081 --no-daemon'

  identifier-migrate:
    image: postgres:16-alpine
    depends_on:
      identity-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ${G9_IDENTIFIER_ROOT:?G9_IDENTIFIER_ROOT is required}/migrations:/migrations:ro
    command: >-
      sh -ec 'psql -h identity-postgres -U postgres -d identity_db -f /migrations/001_init.sql &&
      psql -h identity-postgres -U postgres -d identity_db -f /migrations/002_email_verification_tokens.sql'

  mock-upstream:
    build:
      context: ./mock-upstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20

  fake-payment:
    build:
      context: ./fixtures/fake-payment
    depends_on:
      kafka:
        condition: service_healthy
      schema-seed:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GRPC_ADDR: ":50051"
      HTTP_ADDR: ":8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-gym-plans:
    build:
      context: ${G9_PLANS_ROOT:?G9_PLANS_ROOT is required}
      secrets:
        - source: github_token
          target: github_token
          mode: 0400
    depends_on:
      plans-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://plans-postgres:5432/plans_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PLANS_GRPC_TLS_ENABLED: "true"
      PLANS_GRPC_SERVER_CERT: /run/mtls/ms-gym-plans.crt
      PLANS_GRPC_SERVER_KEY: /run/mtls/ms-gym-plans.key
      PLANS_GRPC_CLIENT_CA: /run/mtls/g9-ca.crt
    volumes:
      - ./g9-certs/runtime/plans:/run/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\\\r\\\\n\\\\r\\\\n' >&3 && grep -q '200' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-gym-member:
    build:
      context: ${G9_MEMBER_ROOT:?G9_MEMBER_ROOT is required}
      secrets:
        - source: github_token
          target: github_token
          mode: 0400
    depends_on:
      member-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-seed:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      schema-seed:
        condition: service_completed_successfully
      ms-gym-plans:
        condition: service_healthy
      fake-payment:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://member-postgres:5432/gym_member
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MEMBER_GRPC_TLS_ENABLED: "true"
      MEMBER_GRPC_SERVER_CERT: /run/mtls/ms-gym-member.crt
      MEMBER_GRPC_SERVER_KEY: /run/mtls/ms-gym-member.key
      MEMBER_GRPC_CLIENT_CA: /run/mtls/g9-ca.crt
      PLANS_GRPC_TARGET: ms-gym-plans:50051
      PLANS_GRPC_USE_PLAINTEXT: "false"
      PLANS_CLIENT_CERT: /run/mtls/member-client.crt
      PLANS_CLIENT_KEY: /run/mtls/member-client.key
      PLANS_SERVER_CA: /run/mtls/g9-ca.crt
      PLANS_GRPC_AUTHORITY: ms-gym-plans
      PAYMENT_GRPC_TARGET: fake-payment:50051
      PAYMENT_GRPC_USE_PLAINTEXT: "true"
    volumes:
      - ./g9-certs/runtime/member:/run/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\\\r\\\\n\\\\r\\\\n' >&3 && grep -q '200' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-gym-identifier:
    build:
      context: ${G9_IDENTIFIER_ROOT:?G9_IDENTIFIER_ROOT is required}
      secrets:
        - source: github_token
          target: github_token
          mode: 0400
    depends_on:
      identifier-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ms-gym-plans:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@identity-postgres:5432/identity_db?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JWT_PRIVATE_KEY_PATH: /run/jwt/fixture_rsa.key
      PLANS_GRPC_ADDR: ms-gym-plans:50051
      PLANS_CLIENT_CERT: /run/mtls/identifier.crt
      PLANS_CLIENT_KEY: /run/mtls/identifier.key
      PLANS_SERVER_CA: /run/mtls/g9-ca.crt
    volumes:
      - ./g9-certs/runtime/identifier:/run/mtls:ro
      - ./certs/fixture_rsa.key:/run/jwt/fixture_rsa.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-gym-api-gateway:
    build:
      context: ./generated-gateway
      secrets:
        - source: github_token
          target: github_token
          mode: 0400
    depends_on:
      ms-gym-plans:
        condition: service_healthy
      ms-gym-member:
        condition: service_healthy
    environment:
      HTTPS_ADDR: ":8443"
      TLS_SERVER_CERT: /run/mtls/ms-gym-api-gateway-server.crt
      TLS_SERVER_KEY: /run/mtls/ms-gym-api-gateway-server.key
      TLS_CLIENT_CA: /run/mtls/g9-ca.crt
      TLS_CLIENT_CERT: /run/mtls/ms-gym-api-gateway-client.crt
      TLS_CLIENT_KEY: /run/mtls/ms-gym-api-gateway-client.key
      MEMBER_GRPC_ADDR: ms-gym-member:50051
      MEMBER_GRPC_SERVER_CA: /run/mtls/g9-ca.crt
      PLANS_GRPC_ADDR: ms-gym-plans:50051
      PLANS_GRPC_SERVER_CA: /run/mtls/g9-ca.crt
    volumes:
      - ./g9-certs/runtime/gateway:/run/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8443"]
      interval: 2s
      timeout: 2s
      retries: 30

  kong:
    image: kong:3.8-ubuntu@sha256:250cc9745fde8ce04be060bc8e4338dfc280f54986cb38ef24d03876cb6b6e2f
    depends_on:
      redis:
        condition: service_healthy
      ms-gym-identifier:
        condition: service_healthy
      ms-gym-api-gateway:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl http2
      KONG_SSL_CERT: /run/mtls/kong-proxy.crt
      KONG_SSL_CERT_KEY: /run/mtls/kong-proxy.key
      KONG_PLUGINS: bundled,gym-jwt-claims
      KONG_LUA_PACKAGE_PATH: /opt/?.lua;/opt/?/init.lua;;
    volumes:
      - ./g9-rendered-kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ./g9-certs/runtime/kong:/run/mtls:ro
      - ./plugins/gym-jwt-claims:/opt/kong/plugins/gym-jwt-claims:ro
    ports:
      - "8443:8443"
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20

secrets:
  github_token:
    environment: GITHUB_TOKEN
