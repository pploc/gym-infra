# Draft G10 fixture. run-g10.sh rejects this until a finalized digest lock exists.
name: gym-g10

services:
  yugabyte:
    image: ${G10_YUGABYTE_IMAGE:?G10_YUGABYTE_IMAGE is required}
    command: ["bin/yugabyted", "start", "--background=false"]
    healthcheck:
      test: ["CMD-SHELL", "ysqlsh -h \"$$(hostname)\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  localstack:
    image: ${G10_LOCALSTACK_IMAGE:?G10_LOCALSTACK_IMAGE is required}
    environment:
      SERVICES: kms
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  kms-init:
    image: ${G10_LOCALSTACK_IMAGE:?G10_LOCALSTACK_IMAGE is required}
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command: ["sh", "-ec", "aws --endpoint-url=http://localstack:4566 kms describe-key --key-id alias/ms-gym-checkin-qr-root >/dev/null 2>&1 || { key_id=$$(aws --endpoint-url=http://localstack:4566 kms create-key --description 'ms-gym-checkin G10 QR root key' --query KeyMetadata.KeyId --output text); aws --endpoint-url=http://localstack:4566 kms create-alias --alias-name alias/ms-gym-checkin-qr-root --target-key-id \"$$key_id\"; }"]

  kafka:
    image: ${G10_KAFKA_IMAGE:?G10_KAFKA_IMAGE is required}
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  schema-registry:
    image: ${G10_SCHEMA_REGISTRY_IMAGE:?G10_SCHEMA_REGISTRY_IMAGE is required}
    depends_on:
      kafka:
        condition: service_started
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

  checkin-migrate:
    image: ${G10_YUGABYTE_IMAGE:?G10_YUGABYTE_IMAGE is required}
    depends_on:
      yugabyte:
        condition: service_healthy
    volumes:
      - ${G10_CHECKIN_ROOT:?G10_CHECKIN_ROOT is required}/migrations:/migrations:ro
    command: ["sh", "-ec", "ysqlsh -h yugabyte -c 'CREATE DATABASE checkin_db' || true; ysqlsh -h yugabyte -d checkin_db -f /migrations/001_init.sql"]

  identity-postgres:
    image: ${G10_POSTGRES_IMAGE:?G10_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  member-postgres:
    image: ${G10_POSTGRES_IMAGE:?G10_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: gym_member
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_member"]
      interval: 2s
      timeout: 2s
      retries: 30

  plans-postgres:
    image: ${G10_POSTGRES_IMAGE:?G10_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: plans_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plans_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: ${G10_REDIS_IMAGE:?G10_REDIS_IMAGE is required}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  identifier-migrate:
    image: ${G10_POSTGRES_IMAGE:?G10_POSTGRES_IMAGE is required}
    depends_on:
      identity-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ${G10_IDENTIFIER_ROOT:?G10_IDENTIFIER_ROOT is required}/migrations:/migrations:ro
    command: ["sh", "-ec", "psql -h identity-postgres -U postgres -d identity_db -f /migrations/001_init.sql; psql -h identity-postgres -U postgres -d identity_db -f /migrations/002_email_verification_tokens.sql"]

  ms-gym-identifier:
    image: ${G10_IDENTIFIER_IMAGE:?G10_IDENTIFIER_IMAGE is required}
    depends_on:
      identifier-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ms-gym-plans:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@identity-postgres:5432/identity_db?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JWT_PRIVATE_KEY_PATH: /run/jwt/fixture_rsa.key
      PLANS_GRPC_ADDR: ms-gym-plans:50051
      PLANS_CLIENT_CERT: /run/mtls/identifier.crt
      PLANS_CLIENT_KEY: /run/mtls/identifier.key
      PLANS_SERVER_CA: /run/mtls/g10-ca.crt
    volumes:
      - ./g10-certs/runtime/identifier:/run/mtls:ro
      - ./certs/fixture_rsa.key:/run/jwt/fixture_rsa.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  member-migrate:
    image: ${G10_POSTGRES_IMAGE:?G10_POSTGRES_IMAGE is required}
    depends_on:
      member-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ${G10_MEMBER_ROOT:?G10_MEMBER_ROOT is required}/src/main/resources/db/migration:/migrations:ro
    command: ["sh", "-ec", "for migration in /migrations/*.sql; do psql -h member-postgres -U postgres -d gym_member -f \"$$migration\"; done"]

  plans-migrate:
    image: ${G10_POSTGRES_IMAGE:?G10_POSTGRES_IMAGE is required}
    depends_on:
      plans-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ${G10_PLANS_ROOT:?G10_PLANS_ROOT is required}/src/main/resources/db/migration:/migrations:ro
    command: ["sh", "-ec", "for migration in /migrations/*.sql; do psql -h plans-postgres -U postgres -d plans_db -f \"$$migration\"; done"]

  ms-gym-plans:
    image: ${G10_PLANS_IMAGE:?G10_PLANS_IMAGE is required}
    depends_on:
      plans-migrate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://plans-postgres:5432/plans_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PLANS_GRPC_TLS_ENABLED: "true"
      PLANS_GRPC_SERVER_CERT: /run/mtls/ms-gym-plans.crt
      PLANS_GRPC_SERVER_KEY: /run/mtls/ms-gym-plans.key
      PLANS_GRPC_CLIENT_CA: /run/mtls/g10-ca.crt
    volumes:
      - ./g10-certs/runtime/plans:/run/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\\\r\\\\n\\\\r\\\\n' >&3 && grep -q '200' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-gym-member:
    image: ${G10_MEMBER_IMAGE:?G10_MEMBER_IMAGE is required}
    depends_on:
      member-migrate:
        condition: service_completed_successfully
      ms-gym-plans:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://member-postgres:5432/gym_member
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MEMBER_GRPC_TLS_ENABLED: "true"
      MEMBER_GRPC_SERVER_CERT: /run/mtls/ms-gym-member.crt
      MEMBER_GRPC_SERVER_KEY: /run/mtls/ms-gym-member.key
      MEMBER_GRPC_CLIENT_CA: /run/mtls/g10-ca.crt
      PLANS_GRPC_TARGET: ms-gym-plans:50051
      PLANS_GRPC_USE_PLAINTEXT: "false"
      PLANS_CLIENT_CERT: /run/mtls/member-client.crt
      PLANS_CLIENT_KEY: /run/mtls/member-client.key
      PLANS_SERVER_CA: /run/mtls/g10-ca.crt
      PLANS_GRPC_AUTHORITY: ms-gym-plans
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./g10-certs/runtime/member:/run/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\\\r\\\\n\\\\r\\\\n' >&3 && grep -q '200' <&3\""]
      interval: 5s
      timeout: 5s
      retries: 30

  ms-gym-checkin:
    image: ${G10_CHECKIN_IMAGE:?G10_CHECKIN_IMAGE is required}
    depends_on:
      checkin-migrate:
        condition: service_completed_successfully
      kms-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      ms-gym-member:
        condition: service_healthy
      ms-gym-plans:
        condition: service_healthy
    environment:
      GRPC_ADDR: ":50051"
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${G10_CHECKIN_DATABASE_URL:?G10_CHECKIN_DATABASE_URL is required}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      KMS_ENDPOINT_URL: http://localstack:4566
      KMS_KEY_ID: alias/ms-gym-checkin-qr-root
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CHECKIN_GRPC_SERVER_CERT: /run/mtls/ms-gym-checkin.crt
      CHECKIN_GRPC_SERVER_KEY: /run/mtls/ms-gym-checkin.key
      CHECKIN_GRPC_CLIENT_CA: /run/mtls/g10-ca.crt
      MEMBER_GRPC_ADDR: ms-gym-member:50051
      MEMBER_GRPC_CERT: /run/mtls/checkin-client.crt
      MEMBER_GRPC_KEY: /run/mtls/checkin-client.key
      MEMBER_GRPC_CA: /run/mtls/g10-ca.crt
      PLANS_GRPC_ADDR: ms-gym-plans:50051
      PLANS_GRPC_CERT: /run/mtls/checkin-client.crt
      PLANS_GRPC_KEY: /run/mtls/checkin-client.key
      PLANS_GRPC_CA: /run/mtls/g10-ca.crt
    volumes:
      - ./g10-certs/runtime/checkin:/run/mtls:ro

  ms-gym-api-gateway:
    image: ${G10_GATEWAY_IMAGE:?G10_GATEWAY_IMAGE is required}
    depends_on:
      ms-gym-member:
        condition: service_started
      ms-gym-plans:
        condition: service_started
      ms-gym-checkin:
        condition: service_started
    environment:
      HTTPS_ADDR: ":8443"
      TLS_SERVER_CERT: /run/mtls/ms-gym-api-gateway-server.crt
      TLS_SERVER_KEY: /run/mtls/ms-gym-api-gateway-server.key
      TLS_CLIENT_CA: /run/mtls/g10-ca.crt
      TLS_CLIENT_CERT: /run/mtls/ms-gym-api-gateway-client.crt
      TLS_CLIENT_KEY: /run/mtls/ms-gym-api-gateway-client.key
      MEMBER_GRPC_ADDR: ms-gym-member:50051
      MEMBER_GRPC_SERVER_CA: /run/mtls/g10-ca.crt
      PLANS_GRPC_ADDR: ms-gym-plans:50051
      PLANS_GRPC_SERVER_CA: /run/mtls/g10-ca.crt
      CHECKIN_GRPC_ADDR: ms-gym-checkin:50051
      CHECKIN_GRPC_SERVER_CA: /run/mtls/g10-ca.crt
    volumes:
      - ./g10-certs/runtime/gateway:/run/mtls:ro

  kong:
    image: ${G10_KONG_IMAGE:?G10_KONG_IMAGE is required}
    depends_on:
      ms-gym-identifier:
        condition: service_started
      ms-gym-api-gateway:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl http2
      KONG_ADMIN_LISTEN: "off"
      KONG_SSL_CERT: /run/mtls/kong-proxy.crt
      KONG_SSL_CERT_KEY: /run/mtls/kong-proxy.key
      KONG_PLUGINS: bundled,gym-jwt-claims
      KONG_LUA_PACKAGE_PATH: /opt/?.lua;/opt/?/init.lua;;
    volumes:
      - ./g10-rendered-kong.yml:/usr/local/kong/declarative/kong.yml:ro
      - ./g10-certs/runtime/kong:/run/mtls:ro
      - ./plugins/gym-jwt-claims:/opt/kong/plugins/gym-jwt-claims:ro
    ports: ["8443:8443"]

secrets:
  github_token:
    environment: GITHUB_TOKEN
