_format_version: "3.0"
_transform: true

services:
  - name: ms-gym-identifier
    url: http://ms-gym-identifier:8080
    routes: []
  - name: ms-gym-api-gateway
    protocol: https
    host: ms-gym-api-gateway
    port: 8443
    client_certificate:
      id: 10000000-0000-0000-0000-000000000001
    tls_verify: true
    tls_verify_depth: 1
    ca_certificates: [20000000-0000-0000-0000-000000000001]
    routes: []

