  - name: cors
    config:
      origins: ["https://localhost:3000"]
      methods: [GET, POST, PUT, OPTIONS]
      headers: [Accept, Authorization, Content-Type, If-Match, Traceparent, Tracestate]
      exposed_headers: [x-error-code, grpc-status, grpc-message]
      credentials: true
      max_age: 3600
      preflight_continue: false
